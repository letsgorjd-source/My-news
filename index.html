<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 세계</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; background: #0A0A0F; color: #fff; font-family: sans-serif; }
        .btn { padding: 10px 16px; border-radius: 10px; border: none; color: #fff; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const CATEGORIES = [
            { id: "hot", label: "🔥 핫이슈", color: "#FF4500" },
            { id: "politics", label: "⚖️ 정치", color: "#3B82F6" },
            { id: "economy", label: "📈 경제", color: "#10B981" },
            { id: "climate", label: "🌍 기후", color: "#F59E0B" },
        ];

        // 여기에 아까 복사한 Gemini API 키를 넣으세요!
        const API_KEY = "발급받은_API_키를_여기에_넣으세요";

        function NewsApp() {
            const [active, setActive] = useState("hot");
            const [data, setData] = useState({});
            const [loading, setLoading] = useState(false);
            const [selected, setSelected] = useState(null);

            const fetchNews = async (id) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `JSON array format: [ { "title": "korean title", "summary": "korean summary", "source": "name", "time": "time" } ]. 4 news for ${id} category.` }] }]
                    })
                });
                const result = await res.json();
                const text = result.candidates[0].content.parts[0].text;
                return JSON.parse(text.match(/\[[\s\S]*\]/)[0]);
            };

            const load = async (id) => {
                if (data[id]) return;
                setLoading(true);
                try {
                    const items = await fetchNews(id);
                    setData(prev => ({ ...prev, [id]: items }));
                } catch (e) { alert("오류 발생!"); }
                setLoading(false);
            };

            useEffect(() => { load("hot"); }, []);

            return (
                <div style={{ padding: "20px" }}>
                    <h1>오늘의 세계</h1>
                    <div style={{ display: "flex", gap: "10px", overflowX: "auto", marginBottom: "20px" }}>
                        {CATEGORIES.map(c => (
                            <button key={c.id} className="btn" style={{ background: active === c.id ? c.color : "#1A1A25" }}
                                    onClick={() => { setActive(c.id); setSelected(null); load(c.id); }}>
                                {c.label}
                            </button>
                        ))}
                    </div>
                    {loading ? <p>로딩 중...</p> : selected ? (
                        <div>
                            <button onClick={() => setSelected(null)} style={{color: "#888", background: "none", border: "none"}}>← 뒤로</button>
                            <h2>{selected.title}</h2>
                            <p style={{lineHeight: "1.6", color: "#ccc"}}>{selected.summary}</p>
                        </div>
                    ) : (
                        (data[active] || []).map((item, i) => (
                            <div key={i} onClick={() => setSelected(item)} style={{ padding: "15px 0", borderBottom: "1px solid #222" }}>
                                <h3 style={{fontSize: "16px"}}>{item.title}</h3>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NewsApp />);
    </script>
</body>
</html>
