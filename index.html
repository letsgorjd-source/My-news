<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 세계</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; background: #0A0A0F; color: #fff; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .btn { padding: 10px 18px; border-radius: 12px; border: none; color: #fff; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
        .card { padding: 15px 0; border-bottom: 1px solid #1A1A25; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const CATEGORIES = [
            { id: "hot", label: "🔥 핫이슈", color: "#FF4500" },
            { id: "politics", label: "⚖️ 정치", color: "#3B82F6" },
            { id: "economy", label: "📈 경제", color: "#10B981" },
            { id: "climate", label: "🌍 기후", color: "#F59E0B" },
        ];

        // ⚠️ 주의: 키를 넣을 때 따옴표 사이에 빈칸 없이 넣어주세요!
        const API_KEY = "AIzaSyBlg5XUzchichjJ6Z5zZUy1kujYOu0LdZ8";

        function NewsApp() {
            const [active, setActive] = useState("hot");
            const [data, setData] = useState({});
            const [loading, setLoading] = useState(false);
            const [selected, setSelected] = useState(null);

            const fetchNews = async (id) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `You are a news curator. Return ONLY a JSON array for '${id}' news. Format: [ { "title": "korean title", "summary": "korean summary", "source": "source", "time": "time" } ]. No markdown.` }] }]
                    })
                });
                
                if (!res.ok) throw new Error("API_ERROR");
                const result = await res.json();
                const text = result.candidates[0].content.parts[0].text;
                const cleanJson = text.match(/\[[\s\S]*\]/)[0];
                return JSON.parse(cleanJson);
            };

            const load = async (id) => {
                if (data[id]) return;
                setLoading(true);
                try {
                    const items = await fetchNews(id);
                    setData(prev => ({ ...prev, [id]: items }));
                } catch (e) { 
                    alert("뉴스를 가져오지 못했습니다. API 키나 네트워크를 확인해주세요.");
                }
                setLoading(false);
            };

            useEffect(() => { load("hot"); }, []);

            return (
                <div style={{ padding: "30px 20px" }}>
                    <h1 style={{fontSize: "26px", fontWeight: "800", marginBottom: "25px"}}>오늘의 세계</h1>
                    <div style={{ display: "flex", gap: "8px", overflowX: "auto", marginBottom: "30px", paddingBottom: "5px" }}>
                        {CATEGORIES.map(c => (
                            <button key={c.id} className="btn" style={{ background: active === c.id ? c.color : "#1A1A25" }}
                                    onClick={() => { setActive(c.id); setSelected(null); load(c.id); }}>
                                {c.label}
                            </button>
                        ))}
                    </div>
                    {loading ? (
                        <div style={{textAlign: "center", marginTop: "100px", color: "#444"}}>AI 브리핑 생성 중...</div>
                    ) : selected ? (
                        <div>
                            <button onClick={() => setSelected(null)} style={{color: "#666", background: "none", border: "none", padding: "0 0 20px 0", fontSize: "16px"}}>← 목록으로</button>
                            <h2 style={{fontSize: "22px", lineHeight: "1.5", marginBottom: "20px"}}>{selected.title}</h2>
                            <div style={{padding: "25px", background: "#111118", borderRadius: "20px", border: "1px solid #1A1A25", lineHeight: "1.8", color: "#ccc"}}>
                                {selected.summary}
                            </div>
                        </div>
                    ) : (
                        (data[active] || []).map((item, i) => (
                            <div key={i} className="card" onClick={() => setSelected(item)}>
                                <h3 style={{fontSize: "17px", fontWeight: "500", margin: "0 0 8px 0", lineHeight: "1.4"}}>{item.title}</h3>
                                <span style={{fontSize: "12px", color: "#444"}}>{item.source} · {item.time}</span>
                            </div>
                        ))
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NewsApp />);
    </script>
</body>
</html>
